<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continuum — chat client spike</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
      }
      .chats {
        width: 200px;
        border-right: 1px solid #ddd;
        padding: 8px;
      }
      .chats button {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 4px;
      }
      .chats button.active {
        font-weight: bold;
      }
      .pane {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        transition: opacity 0.2s;
      }
      .messages.animating {
        opacity: 0.6;
      }
      .msg {
        padding: 4px 8px;
        margin: 2px 0;
        border-radius: 6px;
        background: #f3f3f3;
      }
      .msg .rx {
        color: #888;
        font-size: 12px;
        margin-left: 8px;
      }
      .msg.edited .text::after {
        content: " (edited)";
        color: #888;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
