name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Publish contract: packed tarballs must install and build in a clean
      # Vite project (no monorepo aliases). Perf measurements stay local-only.
      - name: Smoke (publish contract)
        run: npm run smoke
